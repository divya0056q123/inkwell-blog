<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f4">
    <meta name="description" content="A quiet corner of the internet for thoughtful stories.">
    <title>Inkwell — stories worth sharing</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Inkwell home"><span class="brand-mark">i.</span> inkwell</a>
      <nav class="header-actions" aria-label="Main navigation">
        <span class="welcome-label hidden" id="welcome-label"></span>
        <a class="button button-quiet hidden" id="my-stories-link" href="/me">My stories</a>
        <a class="button button-quiet hidden" id="bookmarks-link" href="/bookmarks">Bookmarks</a>
        <a class="button button-quiet hidden" id="profile-link" href="/settings">Profile</a>
        <button class="button button-quiet hidden" id="sign-out" type="button">Sign out</button>
        <a class="button button-quiet" id="sign-in-link" href="/login">Sign in</a>
        <a class="button button-dark" id="write-link" href="/write">Start writing <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer">
      <a class="brand" href="/"><span class="brand-mark">i.</span> inkwell</a>
      <span>Made for the love of a good story.</span>
      <span id="footer-year"></span>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
